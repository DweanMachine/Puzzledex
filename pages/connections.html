<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/connections.css">
</head>
<body>
  <header class="pageHeader">
    <h1>Connections</h1>
    <a class="homeLink" href="../index.html">Home</a>
  </header>
  <hr>
  <div class="controls">
    <button class="btn" onclick="window.location.reload()">New Puzzle</button>
    <button class="btn" onclick="reshuffle()">Reshuffle</button>
    <button class="btn" onclick="displayResults()">Submit</button>
  </div>
  <div id="gridContainer"></div>
  <div id="splashScreen">
    <div id="splashContent">
      <h2 id="splashHeadline">Category Found!</h2>
      <p id="categoryInfo"></p>
      <button class="btn" onclick="closeSplashScreen()">Close</button>
    </div>
  </div>

  <script src="../js/connections.js"></script>
</body>
</html>
