<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/connections.css">
  <script src="https://kit.fontawesome.com/ee13ff4682.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="headContent">
    <h1 style="margin-right: 20px;">Connections</h1> 
    <u class="headItem" onclick="window.location.reload();" style="cursor: pointer;">New Puzzle</u>
    <a href="../index.html"><i id="home" class="headItem fa-solid fa-house"></i></a>
  </div>
  <hr>
  <div id="gridContainer"></div>
  <div id="controls">
    <button onclick="displayResults()">SUBMIT</button>
    <button onclick="reshuffle()">RESHUFFLE</button>
  </div>
  <div id="splashScreen">
    <div id="splashContent">
      <h2 id="splashHeadline">Category Found!</h2>
      <p id="categoryInfo"></p>
      <button onclick="closeSplashScreen()">Close</button>
    </div>
  </div>

  <script src="../js/connections.js"></script>
</body>
</html>
