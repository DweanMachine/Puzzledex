<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criss-Crossword</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/crisscross.css">
</head>
<body>
  <header class="pageHeader">
    <h1>Criss-Crossword</h1>
    <a class="homeLink" href="../index.html">Home</a>
  </header>
  <hr>
  <p class="rules">Use the arrows to shift rows and columns until the scrambled letters form a valid word square.</p>
  <div class="controls">
    <button class="btn" id="generateButton">New Puzzle</button>
  </div>
  <p id="status"></p>

  <div id="gameContainer">
  <!-- Top arrows -->
  <div id="top-arrows">
    <button class="shift" id="0-up">↑</button>
    <button class="shift" id="1-up">↑</button>
    <button class="shift" id="2-up">↑</button>
  </div>

  <!-- Row 0 -->
  <div class="row-wrapper">
    <button class="shift side-button" id="0-left">←</button>
    <div class="board-row">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
    </div>
    <button class="shift side-button" id="0-right">→</button>
  </div>

  <!-- Row 1 -->
  <div class="row-wrapper">
    <button class="shift side-button" id="1-left">←</button>
    <div class="board-row">
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
    </div>
    <button class="shift side-button" id="1-right">→</button>
  </div>

  <!-- Row 2 -->
  <div class="row-wrapper">
    <button class="shift side-button" id="2-left">←</button>
    <div class="board-row">
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
    <button class="shift side-button" id="2-right">→</button>
  </div>

  <!-- Bottom arrows -->
  <div id="bottom-arrows">
    <button class="shift" id="0-down">↓</button>
    <button class="shift" id="1-down">↓</button>
    <button class="shift" id="2-down">↓</button>
  </div>
</div>

  <script src="../js/crisscross/main.js"></script>
</body>
</html>
